services:
  # Relational Database (Records & Audit)
  postgres:
    image: postgres:16-alpine
    container_name: cuin-postgres
    ports:
      - "5435:5432" # Changed host port to 5435 (5433 taken by another project on this host)
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=cuin_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d cuin_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: cuin-redis
    ports:
      - "6380:6379" # Changed host port to 6380
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------
  # Web Interfaces (Management UIs)
  # --------------------------------------------

  # Postgres UI (PgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cuin-pgadmin
    ports:
      - "18080:80" # Access at http://localhost:18080
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cuin.com
      - PGADMIN_DEFAULT_PASSWORD=password123
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  # Redis UI (RedisInsight)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: cuin-redis-insight
    ports:
      - "15540:5540" # Access at http://localhost:15540 (Uncommon port)
    volumes:
      - ./data/redisinsight:/data
    depends_on:
      - redis
  # Control Plane Backend (Optional: run locally for dev)
