# ============================================
# CUIN v2 - Full Stack Docker Compose
# ============================================
# Builds and runs the entire application: Postgres, Neo4j, Redis,
# the FastAPI backend (DuckDB entity-resolution pipeline), the Next.js
# frontend, and the PgAdmin/RedisInsight management UIs.
#
# Quick start:
#   cp infra/.env.example infra/.env      # adjust PUBLIC_HOST + ports
#   cd infra && docker compose up --build -d
#
# Data (Postgres/Neo4j volumes, pipeline run artifacts, the source
# parquet dataset) lives under ../data and ../backend/data*, shared
# with the previous host-run setup -- nothing is lost by switching to
# containers.
# ============================================

services:
  # ------------------------------------------------------------
  # Identity Graph Database
  # ------------------------------------------------------------
  neo4j:
    image: neo4j:5.15.0
    container_name: cuin-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7476}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-7689}:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - ../data/neo4j/data:/data
      - ../data/neo4j/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Relational Database (records, evidence, audit trail)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cuin-postgres
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-cuin_db}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-cuin_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Cache
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cuin-redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Backend API — FastAPI + DuckDB entity-resolution pipeline
  # ------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cuin-backend
    # Bind mounts (below) keep the HOST's file ownership -- the image's
    # baked-in `cuin` user (uid 1000) won't be able to write into
    # ../backend/data if the host directory is owned by a different uid.
    # Set BACKEND_UID/BACKEND_GID in infra/.env to `id -u`/`id -g` on the
    # host to match; defaults to 1000 (the image's own user) so this is a
    # no-op when they happen to already match.
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-cuin_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-3000},http://localhost:${FRONTEND_PORT:-3000}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-4GB}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-4}
      - PERSIST_TO_POSTGRES=true
    volumes:
      # Runtime state (run artifacts, review queue) and the source
      # dataset are bind-mounted, not baked into the image, so they
      # survive rebuilds and can be swapped without a new image.
      - ../backend/data:/app/data
      - ../backend/data_source:/app/data_source
      - ../backend/policies:/app/policies
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------
  # Frontend — Next.js dashboard
  # ------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time -- see the ARG/ENV
        # block in frontend/Dockerfile for why this can't be a runtime
        # env var. Must be reachable from wherever the browser actually
        # is, not the internal Docker service name.
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}
        NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}/ws
    container_name: cuin-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------
  # Web Interfaces (Management UIs)
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cuin-pgadmin
    ports:
      - "${PGADMIN_PORT:-18080}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@cuin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-password123}
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: cuin-redis-insight
    ports:
      - "${REDIS_INSIGHT_PORT:-15540}:5540"
    privileged: true
    volumes:
      - ../data/redisinsight:/data
    depends_on:
      - redis
    restart: unless-stopped
