# ============================================
# CUIN v2 - Full Stack Docker Compose
# ============================================
# Builds and runs the entire application: Postgres, Neo4j, Redis,
# the FastAPI backend (DuckDB entity-resolution pipeline), the Next.js
# frontend, and the PgAdmin/RedisInsight management UIs.
#
# Quick start:
#   cp infra/.env.example infra/.env      # adjust PUBLIC_HOST + ports
#   cd infra && docker compose up --build -d
#
# Data (Postgres/Neo4j volumes, pipeline run artifacts, the source
# parquet dataset) lives under ../data and ../backend/data*, shared
# with the previous host-run setup -- nothing is lost by switching to
# containers.
#
# `name:` below pins the Compose PROJECT name explicitly. Without it,
# Compose derives the project name from the directory basename ("infra"),
# which WILL collide with any other project on this host that also has
# an infra/ folder -- Compose matches pre-existing containers by
# project+service label, not by container_name, so `docker compose up`
# from a colliding directory silently adopts (and on rebuild, destroys)
# the other project's containers. Learned this the hard way -- see git
# history / incident notes if this comment seems paranoid.
# ============================================

name: cuin-controlplane

services:
  # ------------------------------------------------------------
  # Identity Graph Database
  # ------------------------------------------------------------
  neo4j:
    image: neo4j:5.15.0
    container_name: cuin-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7476}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-7689}:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - ../data/neo4j/data:/data
      - ../data/neo4j/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Relational Database (records, evidence, audit trail)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cuin-postgres
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - POSTGRES_DB=${POSTGRES_DB:-cuin_db}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-cuin_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Cache
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cuin-redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------
  # Apache Doris -- alternate MPP execution engine (see
  # pipeline.doris_orchestrator). All-in-one image (FE+BE in one
  # container) for single-node / low-resource deployments; a real
  # multi-BE cluster would split these into separate services.
  #
  # HOST PREREQUISITE (cannot be set from inside a container or via
  # Compose's `sysctls:` -- vm.max_map_count is not a namespaced kernel
  # param): the BE refuses to start unless the HOST's
  # vm.max_map_count >= 2000000. Set it once, persistently, via
  #   echo 'vm.max_map_count=2000000' | sudo tee /etc/sysctl.d/99-doris.conf
  #   sudo sysctl --system
  # before bringing this service up. See docs/doris_compatibility.md.
  # ------------------------------------------------------------
  doris:
    image: apache/doris:4.0.3-all-slim
    container_name: cuin-doris
    # The image's entrypoint backgrounds FE/BE then `exec`s CMD; with no
    # CMD it exits immediately despite FE/BE still running. Keep PID 1
    # alive so `restart: unless-stopped` actually means something.
    command: [ "tail", "-f", "/dev/null" ]
    ports:
      - "${DORIS_FE_HTTP_PORT:-8130}:8030" # FE HTTP (Stream Load entry point)
      - "${DORIS_FE_MYSQL_PORT:-9130}:9030" # FE MySQL protocol
      # BE HTTP must be reachable directly from the client: Stream Load
      # PUTs to the FE, which 307-redirects to the target BE's own HTTP
      # port to actually receive the data.
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
      - "${DORIS_BE_HEARTBEAT_PORT:-9050}:9050"
    environment:
      # This sandbox's host has swap enabled and can't disable it; Doris
      # BE otherwise refuses to start ("Disable swap memory before
      # starting be"). Skip in a deployment that can guarantee no swap.
      - SKIP_CHECK_ULIMIT=true
    volumes:
      # Named volumes (not bind mounts) -- durability across container
      # recreation is the whole point of this block; `docker inspect`
      # showed `Mounts: []` on the ad-hoc `docker run` container this
      # replaces, meaning all data died with the container.
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_be_storage:/opt/apache-doris/be/storage
      - doris_fe_log:/opt/apache-doris/fe/log
      - doris_be_log:/opt/apache-doris/be/log
      # Lakehouse reads: the LOCAL() table-value function resolves
      # `file_path` relative to the BE process's OWN working directory
      # (verified live against Doris 4.0.3 -- a leading '/' does NOT
      # mean the container filesystem root), so these must be mounted
      # under /opt/apache-doris/be/, at the SAME relative subpath names
      # the backend service uses from ITS working directory (/app) --
      # that symmetry is what lets both engines address the same file
      # with the same relative path string. Read-only: Doris only ever
      # reads the lake via LOCAL(); DuckDB is what writes it.
      - ../backend/data_source:/opt/apache-doris/be/data_source:ro
      - ../backend/data:/opt/apache-doris/be/data:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8030/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s # FE+BE cold start is slow -- don't flap unhealthy during boot
    restart: unless-stopped

  # ------------------------------------------------------------
  # Backend API — FastAPI + DuckDB/Doris entity-resolution pipeline
  # ------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cuin-backend
    # Bind mounts (below) keep the HOST's file ownership -- the image's
    # baked-in `cuin` user (uid 1000) won't be able to write into
    # ../backend/data if the host directory is owned by a different uid.
    # Set BACKEND_UID/BACKEND_GID in infra/.env to `id -u`/`id -g` on the
    # host to match; defaults to 1000 (the image's own user) so this is a
    # no-op when they happen to already match.
    user: "${BACKEND_UID:-1000}:${BACKEND_GID:-1000}"
    ports:
      - "${BACKEND_PORT:-8110}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-cuin_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-30011},http://localhost:${FRONTEND_PORT:-30011}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-4GB}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-4}
      - PERSIST_TO_POSTGRES=true
      - DORIS_HOST=doris
      - DORIS_MYSQL_PORT=9030
      - DORIS_HTTP_PORT=8030
      - DORIS_USER=${DORIS_USER:-root}
      - DORIS_PASSWORD=${DORIS_PASSWORD:-}
      - LAKE_ROOT=${LAKE_ROOT:-/app/data/lake}
    volumes:
      # Runtime state (run artifacts, review queue) and the source
      # dataset are bind-mounted, not baked into the image, so they
      # survive rebuilds and can be swapped without a new image.
      - ../backend/data:/app/data
      - ../backend/data_source:/app/data_source
      - ../backend/policies:/app/policies
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      doris:
        condition: service_started # not service_healthy -- Doris is optional; DuckDB path must work without it
    restart: unless-stopped

  # ------------------------------------------------------------
  # Frontend — Next.js dashboard
  # ------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time -- see the ARG/ENV
        # block in frontend/Dockerfile for why this can't be a runtime
        # env var. Must be reachable from wherever the browser actually
        # is, not the internal Docker service name.
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8110}
        NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8110}/ws
    container_name: cuin-frontend
    ports:
      - "${FRONTEND_PORT:-30011}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------
  # Web Interfaces (Management UIs)
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cuin-pgadmin
    ports:
      - "${PGADMIN_PORT:-18080}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@cuin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-password123}
    volumes:
      - ../data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: cuin-redis-insight
    ports:
      - "${REDIS_INSIGHT_PORT:-15540}:5540"
    volumes:
      - ../data/redisinsight:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  # Named volumes -- managed by Docker, survive `docker compose down`
  # (though not `docker compose down -v`). This is what makes Doris
  # data durable across container recreation; see the `doris` service
  # comment above for the incident this fixes.
  doris_fe_meta:
  doris_be_storage:
  doris_fe_log:
  doris_be_log:
